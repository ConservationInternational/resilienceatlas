AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFront CDN for the Resilience Atlas API and versioned public tile route'

Parameters:
  FQDN:
    Type: String
    Description: Fully qualified domain name, e.g. api.resilienceatlas.org
  ZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for the domain (e.g. Z111111QQQQQQQ)
  ALBDomainName:
    Type: String
    Description: ALB DNS name, e.g. resilienceatlas-alb-407780533.us-east-1.elb.amazonaws.com
  BackendFQDN:
    Type: String
    Description: Backend hostname for ALB routing, e.g. resilienceatlas.org or staging.resilienceatlas.org
Resources:
  # Only the explicit /api/public-tiles/* behavior below is edge cached.
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "API CDN for ${FQDN}"
        Aliases:
          - !Ref FQDN
        HttpVersion: http2and3
        PriceClass: PriceClass_100  # North America + Europe edge locations
        ViewerCertificate:
          AcmCertificateArn: !Ref CloudFrontCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: ALBOrigin
            DomainName: !Ref ALBDomainName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        CustomErrorResponses:
          - ErrorCode: 400
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
        CacheBehaviors:
          # Health check endpoint — bypass cache
          - PathPattern: /health*
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # AWS managed CachingDisabled
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          # Mutating endpoints (POST/PUT/DELETE) — bypass cache
          - PathPattern: /api/share
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /api/feedbacks
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /api/photos
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /api/site-scope/authenticate
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          # Only versioned, eligibility-checked public tiles may use edge caching.
          - PathPattern: /api/public-tiles/*
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref PublicTilesCachePolicy
            OriginRequestPolicyId: !Ref PublicTilesOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref PublicTilesCorsResponsePolicy
          - PathPattern: /api/titiler/*
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled — TiTiler proxied requests vary too much
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          # Admin routes — bypass cache
          - PathPattern: /admin/*
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          # User endpoints — bypass cache (sessions, auth)
          - PathPattern: /users/*
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy

  PublicTilesCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-PublicTilesCachePolicy"
        Comment: "Cache successful versioned public tiles for at most 24 hours"
        DefaultTTL: 86400
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings:
              - source_index
              - time
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  PublicTilesOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-PublicTilesOriginRequestPolicy"
        Comment: "Forward only public tile variants and Origin; never credentials or cookies"
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Host
            - Origin
        QueryStringsConfig:
          QueryStringBehavior: whitelist
          QueryStrings:
            - source_index
            - time

  PublicTilesCorsResponsePolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-PublicTilesCorsResponsePolicy"
        Comment: "CORS for the public tile route"
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - "*"
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowOrigins:
            Items:
              - "*"
          AccessControlMaxAgeSec: 600
          OriginOverride: true

  # Origin request policy — forward Host for ALB routing, plus auth headers
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-ApiOriginRequestPolicy"
        Comment: "Forward Host + auth headers to ALB for API routing"
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: allViewer
        QueryStringsConfig:
          QueryStringBehavior: all  # Forward all query params to origin

  # ACM Certificate — must be in us-east-1 for CloudFront
  CloudFrontCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref FQDN
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref FQDN
          HostedZoneId: !Ref ZoneId

  # DNS record — points FQDN to CloudFront distribution
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref ZoneId
      Name: !Ref FQDN
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (always this value)

Outputs:
  CloudFrontUrl:
    Description: "CloudFront CDN URL for API"
    Value: !Sub "https://${FQDN}/"
  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID (for cache invalidation)"
    Value: !Ref CloudFrontDistribution
  CloudFrontDomainName:
    Description: "CloudFront distribution domain name"
    Value: !GetAtt CloudFrontDistribution.DomainName
