local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

local_public:
  service: Disk
  root: <%= Rails.root.join("public/storage") %>
  public: true

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

amazon:
  service: S3
  # Credentials are sourced from the EC2 instance role — do not set access_key_id
  # or secret_access_key here. The AWS SDK credential chain handles it automatically.
  bucket: <%= ENV.fetch('S3_BUCKET', 'resilienceatlas') %>
  region: <%= ENV.fetch('AWS_REGION', 'us-east-1') %>
