default: &default
  adapter: postgis
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i %>
  timeout: 5000
  url: <%= ENV["DATABASE_URL"] %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV["DATABASE_PORT"] %>
  username: <%= ENV["DATABASE_USER"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  # ra_app holds all Rails-managed tables; ra_vector/ra_raster hold external data
  # and are included so unqualified SQL in layer queries can resolve without
  # schema-qualifying every table name.
  schema_search_path: ra_app,ra_vector,ra_raster,public

development:
  <<: *default
  database: cigrp

test:
  <<: *default
  database: resilienceatlas_test

staging:
  <<: *default
  database: resilienceatlas_staging

production:
  <<: *default
  database: cigrp
