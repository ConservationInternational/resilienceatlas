services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=cigrp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  martin:
    build:
      context: ./docker
      dockerfile: martin.Dockerfile
    ports:
      - "3002:3000"
    command: ["--config", "/config/martin.yaml"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cigrp
    volumes:
      - ./docker/martin.yaml:/config/martin.yaml:ro
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    ports:
      - "3001:3000"
    environment:
      - RAILS_ENV=development
      - MARTIN_URL=http://martin:3000
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - backend_bundle_cache:/usr/local/bundle
      # Uncomment to mount geoBoundaries data for import:
      # - /path/to/geoboundaries:/data/geoboundaries:ro
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    command: /app/bin/docker-dev-entrypoint

  frontend:
    image: node:24.0.0-bullseye
    working_dir: /app
    tty: true
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CYPRESS_INSTALL_BINARY=0
      - CYPRESS_RUN_BINARY=/dev/null
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Internal API host for server-side rendering (Docker network)
      - INTERNAL_API_HOST=http://backend:3000
      - NEXT_PUBLIC_MARTIN_URL=http://localhost:3002
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: /app/bin/docker-dev-entrypoint.sh

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sidekiq:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    environment:
      - RAILS_ENV=development
      - MARTIN_URL=http://martin:3000
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - backend_bundle_cache:/usr/local/bundle
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_bundle_cache:
  frontend_node_modules:
