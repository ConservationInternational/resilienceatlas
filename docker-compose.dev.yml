services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=cigrp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  martin:
    build:
      context: ./docker
      dockerfile: martin.Dockerfile
    ports:
      - "3002:3000"
    command: ["--config", "/config/martin.yaml"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cigrp
    volumes:
      - ./docker/martin.yaml:/config/martin.yaml:ro
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - RAILS_ENV=development
      - MARTIN_URL=http://martin:3000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - backend_bundle_cache:/usr/local/bundle
      # Uncomment to mount geoBoundaries data for import:
      # - /path/to/geoboundaries:/data/geoboundaries:ro
    networks:
      - app-network
    depends_on:
      - db
    restart: unless-stopped
    command: >
      bash -c "
        bundle install &&
        while ! pg_isready -h db -p 5432 -U postgres; do
          echo 'Waiting for database to be ready...'
          sleep 2
        done &&
        PGPASSWORD=postgres psql -h db -U postgres -d cigrp -c 'CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS postgis_topology;' || true &&
        bundle exec rails db:create db:migrate &&
        if [ \"$${SKIP_SEED:-false}\" != \"true\" ]; then
          bundle exec rails db:seed
        fi &&
        rm -f tmp/pids/server.pid &&
        bundle exec rails server -b 0.0.0.0"

  frontend:
    image: node:24.0.0-bullseye
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CYPRESS_INSTALL_BINARY=0
      - CYPRESS_RUN_BINARY=/dev/null
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Internal API host for server-side rendering (Docker network)
      - INTERNAL_API_HOST=http://backend:3000
      - NEXT_PUBLIC_MARTIN_URL=http://localhost:3002
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped
    command: >
      bash -c "
        git config --global url.https://github.com/.insteadOf ssh://git@github.com/ &&
        npm install &&
        npm run dev"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_bundle_cache:
  frontend_node_modules:
