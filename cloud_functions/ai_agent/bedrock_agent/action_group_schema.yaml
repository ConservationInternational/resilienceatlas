openapi: "3.0.0"
info:
  title: Resilience Atlas Agent Actions
  version: "1.0"
  description: |
    Action group for the Resilience Atlas Bedrock Agent.
    Provides tools to query the RAG knowledge base, manage layers, and import vector data.

paths:
  /retrieve_context:
    post:
      operationId: retrieve_context
      summary: Search the RAG knowledge base for relevant context
      description: |
        Performs a semantic similarity search over layer records and knowledge base documents.
        Use this BEFORE creating or updating layers to find existing similar layers, provider
        configuration examples, and structural documentation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Natural language search query, e.g. "COG layer with viridis colormap"
                top_k:
                  type: integer
                  description: Number of results to return (default 5, max 10)
                  default: 5
      responses:
        "200":
          description: JSON array of matching documents with similarity scores

  /list_site_scopes:
    post:
      operationId: list_site_scopes
      summary: List all available site scopes (Atlas instances)
      description: Returns all site scopes with id, name, and subdomain. Use to find the correct site_scope_id before creating layers.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: JSON array of [{id, name, subdomain}]

  /list_layers:
    post:
      operationId: list_layers
      summary: List existing layers, optionally filtered by site scope or keyword
      description: |
        Returns layers with name, slug, provider, published status, description,
        dataset_shortname, and dataset_source_url. Use keyword to search across name,
        description, slug, dataset_shortname, AND layer_config — e.g. search for a
        PostGIS table name like "forest_cover" to find all martin layers that query it.
        Use this to answer questions like "which layers serve thresholds data" or
        "which layers use the boundaries_adm1 table".
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                site_scope_id:
                  type: integer
                  description: Filter by site scope ID
                keyword:
                  type: string
                  description: Search across layer name, description, slug, and dataset_shortname
      responses:
        "200":
          description: JSON array of [{id, name, slug, layer_provider, published, description, dataset_shortname, dataset_source_url}]

  /get_layer:
    post:
      operationId: get_layer
      summary: Get full details for a single layer by ID or slug
      description: |
        Returns all fields for a layer including layer_config, interaction_config,
        description, dataset_shortname, dataset_source_url, and analysis settings.
        Provide either layer_id (integer) or slug (string) — slug is convenient when
        you know the layer's URL-safe identifier. Use after list_layers to inspect
        a specific layer's full configuration for debugging or before updating it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                layer_id:
                  type: integer
                  description: The layer's integer ID
                slug:
                  type: string
                  description: The layer's unique URL-safe slug (alternative to layer_id)
      responses:
        "200":
          description: Layer detail object

  /create_layer:
    post:
      operationId: create_layer
      summary: Create a new layer in Resilience Atlas
      description: |
        Creates a layer record. Required fields: slug, layer_provider, interaction_config, name.
        The layer_config JSON format depends on the provider — always call retrieve_context first
        to find the correct format. Pass site_scope_id to link the layer to the correct Atlas instance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, layer_provider, name]
              properties:
                site_scope_id:
                  type: integer
                  description: ID of the site scope to add this layer to
                slug:
                  type: string
                  description: Unique URL-safe identifier (alphanumeric, hyphens, underscores)
                name:
                  type: string
                  description: Human-readable layer name
                layer_provider:
                  type: string
                  enum: [cog, esri, gee, martin, wms, wmts, "xyz tileset"]
                layer_config:
                  type: string
                  description: JSON string with provider-specific configuration
                interaction_config:
                  type: string
                  description: JSON string for popup configuration. Minimum valid value is "{}"
                layer_group_id:
                  type: integer
                  description: ID of the layer group to assign this layer to
                description:
                  type: string
                opacity:
                  type: number
                  minimum: 0
                  maximum: 1
                published:
                  type: boolean
                  default: true
                zoom_min:
                  type: integer
                zoom_max:
                  type: integer
                color:
                  type: string
                  description: Hex color for legend swatch
                download:
                  type: boolean
                analysis_suitable:
                  type: boolean
                dataset_shortname:
                  type: string
                dataset_source_url:
                  type: string
      responses:
        "200":
          description: Layer creation result with the created layer data

  /update_layer:
    post:
      operationId: update_layer
      summary: Update an existing layer
      description: Updates a layer by its integer ID. Only provide the fields you want to change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layer_id]
              properties:
                layer_id:
                  type: integer
                  description: The layer's integer ID
                site_scope_id:
                  type: integer
                  description: Site scope this layer belongs to — used for authorization. Required for staff/contributor users.
                name:
                  type: string
                layer_config:
                  type: string
                  description: JSON string with updated provider configuration
                interaction_config:
                  type: string
                description:
                  type: string
                opacity:
                  type: number
                published:
                  type: boolean
                zoom_min:
                  type: integer
                zoom_max:
                  type: integer
                color:
                  type: string
                analysis_suitable:
                  type: boolean
      responses:
        "200":
          description: Update result with the updated layer data

  /import_vector_table:
    post:
      operationId: import_vector_table
      summary: Import a vector file from S3 into PostGIS for use with martin provider
      description: |
        Uses ogr2ogr to import a GeoPackage, GeoJSON, KML, Shapefile (zip), or other
        vector format from an S3 URI into a PostGIS table. Returns the table_name and
        metadata (geometry_type, row_count, columns). Use the returned table_name when
        creating a martin layer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s3_uri]
              properties:
                s3_uri:
                  type: string
                  description: "S3 URI of the vector file, e.g. s3://bucket/path/file.gpkg"
                table_name:
                  type: string
                  description: "Optional target PostGIS table name (lowercase, alphanumeric + underscores). Auto-derived from filename if omitted."
      responses:
        "200":
          description: Import result with table_name, geometry_type, srid, row_count, and columns

  /list_tables:
    post:
      operationId: list_tables
      summary: List all PostGIS tables in managed schemas
      description: |
        Returns tables in ra_nonspatial, ra_vector, and ra_raster schemas with their row counts
        and which layers reference each table. Use this to discover available data sources before
        writing SQL for a martin layer, or to find which table holds specific data.
        Use the optional keyword filter (q) to narrow results by table name.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: Filter by table name substring, e.g. "sbtn" or "ecoregion"
      responses:
        "200":
          description: JSON array of [{name, schema, row_count, layers:[{id,slug,name}]}]

  /describe_table:
    post:
      operationId: describe_table
      summary: Get columns, types, and sample rows for a specific PostGIS table
      description: |
        Returns column names and data types plus up to 10 sample rows from the table.
        Use this to understand what data is available before writing a SQL query
        for a martin layer_config. Works for tables in ra_nonspatial, ra_vector, and ra_raster.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table_name]
              properties:
                table_name:
                  type: string
                  description: "Bare table name (no schema prefix), e.g. 'sbtn_thresholds' or 'ecoregions2017'"
      responses:
        "200":
          description: "{name, schema, total_rows, columns:[{name,type}], sample_rows:[[...]]}"

  /create_vector_view:
    post:
      operationId: create_vector_view
      summary: Create (or replace) a PostgreSQL view in ra_vector from a SELECT query
      description: |
        Creates a named view in the ra_vector schema using a bare SELECT statement.
        The view can join any combination of ra_vector, ra_nonspatial, or ra_raster tables.
        Once created, the view is immediately available as a martin tile source:
          layer_config.body.source  = "ra_vector_tile"
          layer_config.body.params  = { "table": "<view_name>" }

        IMPORTANT: body.source must NEVER contain raw SQL. Use this action to create
        a view first, then reference the view name in the layer_config.

        Rules:
          - name must start with "v_" (e.g. "v_my_join")
          - sql must be a bare SELECT (no INSERT/UPDATE/DROP/semicolons)
          - the SELECT must expose a geometry column from ra_vector or ra_raster
          - only ra_vector, ra_nonspatial, and ra_raster schemas are allowed in the SQL

        Use describe_table on both tables to find the correct join key columns before
        writing the SELECT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sql]
              properties:
                name:
                  type: string
                  description: "View name, must start with 'v_', lowercase alphanumeric + underscores, max 63 chars. E.g. 'v_sbtn_thresholds'"
                sql:
                  type: string
                  description: "Bare SELECT statement. No semicolons or DML keywords. Must include a geometry column."
                description:
                  type: string
                  description: "Optional human-readable description stored as a PostgreSQL comment on the view."
      responses:
        "200":
          description: "{ success: true, data: { name, geometry_column, description } } on success, or { success: false, message } on error"

  /drop_vector_view:
    post:
      operationId: drop_vector_view
      summary: Drop a PostgreSQL view from ra_vector
      description: |
        Drops the named view from ra_vector. Any martin layers that reference this
        view via ra_vector_tile?table=<name> will stop serving tiles immediately.
        Only views whose names start with "v_" can be dropped via this action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: "Name of the view to drop (must start with 'v_')"
      responses:
        "200":
          description: "{ success: true, message } or { success: false, message }"

