# Martin tile server configuration
# See https://maplibre.org/martin/config-file/
#
# IMPORTANT: When using --config, Martin ignores DATABASE_URL as an env var.
# The postgres connection MUST be declared here (it can reference env vars).

# Enable CORS for all origins.
# Martin's `cors: true` defaults to `origin: *`, which per Martin's implementation
# echoes back the request Origin header rather than returning a literal `*`.
# This means CloudFront must include the Origin header in its cache key
# (see infrastructure/martin-cdn/template.yaml TileCachePolicy) so that
# each requesting subdomain receives its own correctly-scoped CORS header.
# Martin serves read-only public map tiles — no auth or cookies — so
# allowing all origins is safe.
cors: true

# Cache boundary tiles in the browser for 24 hours (86400 s), matching
# the CloudFront CDN TTL.  Without this Martin defaults to max-age=3600
# (1 hour), causing needless re-fetches when users return to the map.
cache_control_max_age: 86400

# If a function source doesn't exist yet (e.g. migration hasn't run),
# log a warning instead of aborting startup.
on_invalid: warn

# Database connection — $DATABASE_URL is expanded from the container env.
postgres:
  connection_string: ${DATABASE_URL}
  # Explicitly include ra_app schema for function discovery
  default_srid: 4326
  pool_size: 20
  # Scan these schemas for function sources
  auto_publish:
    tables: false
    functions:
      from_schemas: ra_app
